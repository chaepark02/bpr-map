<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPR 계약 현황 대시보드</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="sido.js"></script>
<script src="sigungu.js"></script>
<script src="centroids.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f4f6fb; color: #1a2340; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
  .header { background: #fff; border-bottom: 1px solid #e2e6f0; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; height: 60px; box-shadow: 0 1px 4px rgba(0,48,135,0.06); }
  .header h1 { font-size: 18px; color: #003087; font-weight: 700; }
  .filter-group { display: flex; gap: 8px; align-items: center; }
  .filter-label { font-size: 12px; font-weight: 600; color: #64748b; margin-right: 4px; }
  .btn-choice { background: #fff; border: 1px solid #cbd5e1; padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
  .btn-choice:hover { background: #f8fafc; }
  .btn-choice.active { background: #003087; color: #fff; border-color: #003087; font-weight: 600; }
  #map { flex: 1; height: 100%; background: #edf2f7; }
  .sidebar { width: 420px; background: #fff; border-left: 1px solid #e2e6f0; display: flex; flex-direction: column; overflow-y: auto; box-shadow: -2px 0 8px rgba(0,0,0,0.02); }
  .panel-section { padding: 20px; border-bottom: 1px solid #edf2f7; }
  .panel-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .panel-title::before { content: ''; display: inline-block; width: 4px; height: 14px; background: #003087; border-radius: 2px; }
  .stat-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 10px; }
  .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; }
  .stat-card .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .stat-card .label { font-size: 13px; color: #475569; font-weight: 500; }
  .stat-card .val { font-size: 14px; font-weight: 700; color: #0f172a; }
  .stat-card .amt { font-size: 13px; color: #003087; font-weight: 600; }
  .accordion-item { border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
  .accordion-header { background: #f8fafc; padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; cursor: pointer; user-select: none; transition: background 0.15s; }
  .accordion-header:hover { background: #f1f5f9; }
  .accordion-content { padding: 12px; font-size: 12px; display: none; background: #fff; border-top: 1px solid #edf2f7; }
  .accordion-content table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .accordion-content th, .accordion-content td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #f1f5f9; }
  .accordion-content th { color: #64748b; font-weight: 600; background: #f8fafc; }
  .badge-light { inline-size: max-content; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #e2e8f0; color: #64748b; }
  .badge-light.on { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-light.active-contract { background: #dcfce7; color: #15803d; }
  .badge-light.no-contract { background: #fee2e2; color: #b91c1c; }
  .map-label { background: transparent; border: none; box-shadow: none; font-size: 11px; font-weight: 700; color: #1e293b; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; text-align: center; white-space: nowrap; pointer-events: none; }
</style>
</head>
<body>

<div class="header">
  <h1>BPR 전국 계약 현황 분석 시스템</h1>
  <div style="display: flex; gap: 16px;">
    <div class="filter-group">
      <span class="filter-label">연도</span>
      <button class="btn-choice" id="btn-yr-2025" onclick="toggleFilter('year', '2025')">2025</button>
      <button class="btn-choice active" id="btn-yr-2026" onclick="toggleFilter('year', '2026')">2026</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">범위</span>
      <button class="btn-choice active" id="btn-layer-A" onclick="setTargetLayer('A')">시도(광역)</button>
      <button class="btn-choice" id="btn-layer-B" onclick="setTargetLayer('B')">시군구(기초)</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">부서</span>
      <button class="btn-choice" id="btn-dept-지방세" onclick="toggleFilter('dept', '지방세')">지방세</button>
      <button class="btn-choice" id="btn-dept-세외수입" onclick="toggleFilter('dept', '세외수입')">세외수입</button>
      <button class="btn-choice" id="btn-dept-기타" onclick="toggleFilter('dept', '기타')">기타</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">유형</span>
      <button class="btn-choice" id="btn-type-신용정보" onclick="toggleFilter('type', '신용정보')">신용정보</button>
      <button class="btn-choice" id="btn-type-전자압류" onclick="toggleFilter('type', '전자압류')">전자압류</button>
      <button class="btn-choice" id="btn-type-EGS" onclick="toggleFilter('type', 'EGS')">EGS</button>
    </div>
    <div class="filter-group">
      <button class="btn-choice active" id="btn-label-toggle" onclick="toggleLabelVisibility()">지역명 표시</button>
    </div>
  </div>
</div>

<div class="container">
  <div id="map"></div>
  <div class="sidebar">
    <div class="panel-section" style="background: #f8fafc;">
      <div class="panel-title">전국 계약현황 총괄<span style="font-size:11px; font-weight:400; color:#64748b;">연도, 부서, 유형 버튼을 눌러 확인하세요!</span></div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="row"><span class="label">시도 단위(광역) (17개 시도)</span><span class="val" id="total-a-count">0개 체결</span></div>
          <div class="row"><span></span><span class="amt" id="total-a-amt">0원</span></div>
        </div>
        <div class="stat-card">
          <div class="row"><span class="label" id="stat-b-label">시군구 단위(기초)</span><span class="val" id="total-b-count">0개 지역 체결</span></div>
          <div class="row"><span></span><span class="amt" id="total-b-amt">0원</span></div>
        </div>
        <div class="stat-card" style="border-left: 4px solid #003087;">
          <div class="row"><span class="label" style="font-weight:700; color:#003087;">Total 합산 금액</span><span class="val" id="total-all-amt" style="color:#003087; font-size:16px;">0원</span></div>
        </div>
      </div>
    </div>
    <div class="panel-section" id="detail-section">
      <div class="panel-title">선택 지역 세부 계약분석</div>
      <div id="detail-fallback" style="font-size:13px; color:#64748b; text-align:center; padding:20px 0;">
        지도 위 행정구역을 클릭하시면 하위 연동 상세 정보가 실시간 집계됩니다.
      </div>
      <div id="detail-content" style="display: none;"></div>
    </div>
    <div class="panel-section" style="flex: 1;">
      <div class="panel-title">17개 시도별 광역+기초 연도별 금액</div>
      <div id="sido-accordion-container"></div>
    </div>
  </div>
</div>

<script>
const DISTRICT_MAP = {
  "수원시장안구":"수원시","수원시권선구":"수원시","수원시팔달구":"수원시","수원시영통구":"수원시",
  "성남시수정구":"성남시","성남시중원구":"성남시","성남시분당구":"성남시",
  "안양시만안구":"안양시","안양시동안구":"안양시",
  "고양시덕양구":"고양시","고양시일산동구":"고양시","고양시일산서구":"고양시",
  "안산시상록구":"안산시","안산시단원구":"안산시",
  "용인시처인구":"용인시","용인시기흥구":"용인시","용인시수지구":"용인시",
  "천안시동남구":"천안시","천안시서북구":"천안시",
  "청주시상당구":"청주시","청주시서원구":"청주시","청주시흥덕구":"청주시","청주시청원구":"청주시",
  "포항시남구":"포항시","포항시북구":"포항시",
  "전주시완산구":"전주시","전주시덕진구":"전주시",
  "창원시의창구":"창원시","창원시성산구":"창원시","창원시마산합포구":"창원시","창원시마산회원구":"창원시","창원어진해구":"창원시"
};

const SIDO_NAME_MAP = {
  "서울시":"서울특별시", "부산시":"부산광역시", "대구시":"대구광역시", "인천시":"인천광역시", 
  "광주시":"광주광역시", "대전시":"대전광역시", "울산시":"울산광역시", "세종시":"세종특별자치시", 
  "경기도":"경기도", "강원도":"강원도", "충북":"충청북도", "충남":"충청남도", 
  "전북":"전라북도", "전남":"전라남도", "경북":"경상북도", "경남":"경상남도", "제주도":"제주특별자치도",
  "서울특별시":"서울특별시", "부산광역시":"부산광역시", "대구광역시":"대구광역시", "인천광역시":"인천광역시",
  "광주광역시":"광주광역시", "대전광역시":"대전광역시", "울산광역시":"울산광역시", "세종특별자치시":"세종특별자치시",
  "충청북도":"충청북도", "충청남도":"충청남도", "전라북도":"전라북도", "전라남도":"전라남도", "경상북도":"경상북도", "경상남도":"경상남도", "제주특별자치도":"제주특별자치도",
  // 최신 행정구역 개편 명칭(지도 geojson은 구/舊명칭 기준이므로 구명칭으로 통일)
  "전북특별자치도":"전라북도", "강원특별자치도":"강원도"
};


let currentFilters = { year: '2026', dept: null, type: null };
let activeLayerScope = 'A';
let showLabels = true;
let rawCsvData = [];
let map, geojsonGroup, labelGroup;

// 선택(클릭) 상태 추적용
let selectedKey = null;
let selectedScope = null;
let selectedLayerRef = null;
let selectedSido = null;      // 선택된 지역이 속한 시도 (B의 경우 geojson 자체의 sido 값)
let selectedSigungu = null;   // 선택된 지역명 (A인 경우 시도명과 동일)

// 사이드 패널에 현재 표시 중인 지역 컨텍스트 (부서별 계약분석 버튼에서 사용)
let currentPanelSido = null;
let currentPanelSigungu = null;
let currentPanelIsScopeA = true;
let currentPanelDept = '지방세';

map = L.map('map', { zoomControl: false }).setView([36.2, 127.8], 7.5);
L.control.zoom({ position: 'topleft' }).addTo(map);
geojsonGroup = L.layerGroup().addTo(map);
labelGroup = L.layerGroup().addTo(map);

window.addEventListener('DOMContentLoaded', () => {
  fetch('./bprdata.csv')
    .then(res => {
      if(!res.ok) throw new Error("bprdata.csv 로드 실패");
      return res.text();
    })
    .then(text => {
      const parsed = Papa.parse(text, { 
        header: true, 
        skipEmptyLines: true,
        transformHeader: h => h ? h.trim() : ""
      });
      rawCsvData = parsed.data.filter(r => r['시도']).map(processCsvRow);
      initDashboard();
    })
    .catch(err => {
      alert("데이터 로드 실패: " + err.message);
    });
});

function initDashboard() {
  document.getElementById('stat-b-label').innerText = `시군구 단위(기초) (${SIGUNGU_GEOJSON.features.length}개 시군구)`;
  renderMap();
  calculateGlobalStats();
  renderGlobalAccordion(); 
}

function toggleFilter(category, value) {
  if (category === 'year') {
    currentFilters.year = currentFilters.year === value ? null : value;
    document.getElementById('btn-yr-2025').classList.toggle('active', currentFilters.year === '2025');
    document.getElementById('btn-yr-2026').classList.toggle('active', currentFilters.year === '2026');
  } else if (category === 'dept') {
    currentFilters.dept = currentFilters.dept === value ? null : value;
    ['지방세', '세외수입', '기타'].forEach(d => {
      document.getElementById(`btn-dept-${d}`).classList.toggle('active', currentFilters.dept === d);
    });
  } else if (category === 'type') {
    currentFilters.type = currentFilters.type === value ? null : value;
    ['신용정보', '전자압류', 'EGS'].forEach(t => {
      document.getElementById(`btn-type-${t}`).classList.toggle('active', currentFilters.type === t);
    });
  }
  renderMap();
  calculateGlobalStats();
  refreshDetailPanelIfSelected();
}

function setTargetLayer(scope) {
  activeLayerScope = scope;
  document.getElementById('btn-layer-A').classList.toggle('active', scope === 'A');
  document.getElementById('btn-layer-B').classList.toggle('active', scope === 'B');
  // 범위(시도/시군구)를 전환하면 선택 상태 및 패널을 초기화한다.
  selectedKey = null;
  selectedScope = null;
  selectedLayerRef = null;
  selectedSido = null;
  selectedSigungu = null;
  document.getElementById('detail-fallback').style.display = 'block';
  document.getElementById('detail-content').style.display = 'none';
  renderMap();
}

// 상단 연도 필터가 바뀌었을 때, 현재 선택된 지역이 있다면 패널 내용을 다시 계산해서 반영한다.
function refreshDetailPanelIfSelected() {
  if (!selectedKey || !selectedScope) return;
  showTargetDetailPanel(selectedSido, selectedSigungu);
}

function toggleLabelVisibility() {
  showLabels = !showLabels;
  document.getElementById('btn-label-toggle').classList.toggle('active', showLabels);
  if (showLabels) { map.addLayer(labelGroup); } else { map.removeLayer(labelGroup); }
}

function cleanNum(val) {
  if(!val) return 0;
  let s = String(val).replace(/[^0-9.-]/g, '');
  return parseFloat(s) || 0;
}

function processCsvRow(row) {
  let rawSido = (row['시도'] || '').trim();
  let matchedSido = SIDO_NAME_MAP[rawSido] || rawSido;

  // Layer 칼럼이 시도(A) / 시군구(B)를 정확히 구분해 주므로 이를 그대로 신뢰한다.
  let layer = (row['Layer'] || '').trim().toUpperCase() === 'A' ? 'A' : 'B';

  let rawSigungu = (row['시군구'] || '').toString().trim();
  // A레이어(시도 자체 계약) 행은 시군구 칸에 도 자체 명칭이 들어있으므로 시도명으로 통일해서 저장한다.
  let matchedSigungu = layer === 'A' ? matchedSido : (DISTRICT_MAP[rawSigungu] || rawSigungu);

  let dept = (row['부서명'] || '').trim();

  let v_신용 = row['신용정보(\\)'] || 0;
  let v_전자 = row['전자압류(\\)'] || 0;
  let v_egs = row['EGS (\\)'] || 0;

  let amt_total = cleanNum(row['합계 (\\)']) * 1000;

  return {
    layer: layer,
    year: String(row['계약연도'] || '').trim(),
    sido: matchedSido,
    sigungu: matchedSigungu,
    anyContract: parseInt(row['계약유형_계약여부']) === 1 || parseInt(row['부서_계약여부']) === 1,
    지방세: dept === '지방세',
    세외수입: dept === '세외수입',
    기타: dept === '기타',
    신용정보: parseInt(row['신용정보']) === 1,
    전자압류: parseInt(row['전자압류']) === 1,
    EGS: parseInt(row['EGS']) === 1,
    amt_total: amt_total,
    amt_지방세: dept === '지방세' ? amt_total : 0,
    amt_세외수입: dept === '세외수입' ? amt_total : 0,
    amt_기타: dept === '기타' ? amt_total : 0,
    amt_신용정보: cleanNum(v_신용) * 1000,
    amt_전자압류: cleanNum(v_전자) * 1000,
    amt_EGS: cleanNum(v_egs) * 1000
  };
}

function getFilteredData() {
  return rawCsvData.filter(item => {
    if (currentFilters.year && item.year !== currentFilters.year) return false;
    if (currentFilters.dept && !item[currentFilters.dept]) return false;
    if (currentFilters.type && !item[currentFilters.type]) return false;
    return true;
  });
}

function checkCoverage(sidoName, sigunguName = null) {
  const filtered = getFilteredData();
  const isDefaultFilter = !currentFilters.dept && !currentFilters.type;

  if (activeLayerScope === 'A') {
    let normSido = SIDO_NAME_MAP[sidoName] || sidoName;
    return filtered.some(d => d.sido === normSido && (isDefaultFilter ? d.anyContract : true));
  } else {
    // ★ 시군구는 이름만으로 매칭하면 동명 지역(북구/중구/동구 등)이 다른 시도의
    // 데이터와 섞여버리는 치명적 오류가 생기므로, 반드시 소속 시도(sidoName)까지 함께 매칭한다.
    if (!sigunguName || !sidoName) return false;
    let normSido = SIDO_NAME_MAP[sidoName] || sidoName;
    return filtered.some(d => d.sido === normSido && d.sigungu === sigunguName && (isDefaultFilter ? d.anyContract : true));
  }
}

// 라벨이 외곽 섬/군 때문에 실질 중심에서 벗어나는 4개 시도는 실질적인 중심 좌표로 고정 표시
const SIDO_LABEL_OVERRIDE = {
  "경상북도": [36.4919, 128.8889],   // 울릉군 포함 바운딩박스로 인한 왜곡 보정 (안동 인근)
  "인천광역시": [37.4563, 126.7052], // 강화도/옹진군 도서 지역으로 인한 왜곡 보정 (인천 본토 중심)
  "경기도": [37.2636, 127.0286],     // 수원 인근 실질 중심
  "충청북도": [36.6424, 127.4890]    // 청주 인근 실질 중심
};

function renderMap() {
  geojsonGroup.clearLayers();
  labelGroup.clearLayers();
  
  const targetGeoJson = activeLayerScope === 'A' ? SIDO_GEOJSON : SIGUNGU_GEOJSON;
  
  let geoJsonLayer = L.geoJSON(targetGeoJson, {
    style: function(feature) {
      let props = feature.properties || {};
      let isCovered = false;
      
      if (activeLayerScope === 'A') {
        let sido = props.CTP_KOR_NM || props.SIDONM || props.sido_name || props.name;
        if (sido) {
          let matchedSido = SIDO_NAME_MAP[sido] || sido;
          isCovered = checkCoverage(matchedSido, null);
        }
      } else {
        // ★ sigungu.js의 각 feature에는 소속 시도명이 이미 props.sido로 들어있으므로
        // 이것을 그대로 신뢰한다. (이름만으로 매칭하면 북구/중구/동구 등 동명 지역이
        // 다른 시도 데이터와 섞이는 치명적 오류가 발생했었음 — 반드시 이 방식 유지)
        let sigungu = props.name || props.SIG_KOR_NM || props.SIGUNGU_NM || props.sigungu_name;
        let parentSido = props.sido || "";
        if (sigungu && parentSido) {
          isCovered = checkCoverage(parentSido, sigungu);
        }
      }
      
      return {
        fillColor: isCovered ? '#003087' : '#d4d9e5',
        fillOpacity: isCovered ? 0.75 : 0.4,
        color: '#ffffff',
        weight: activeLayerScope === 'A' ? 1.8 : 1,
      };
    },
    onEachFeature: function(feature, layer) {
      let props = feature.properties || {};
      let displayName = "";
      let matchedSido = "";
      let parentSido = "";

      if (activeLayerScope === 'A') {
        let sido = props.CTP_KOR_NM || props.SIDONM || props.sido_name || props.name;
        if (!sido) return;
        matchedSido = SIDO_NAME_MAP[sido] || sido;
        displayName = matchedSido;
        parentSido = matchedSido;
      } else {
        let sigungu = props.name || props.SIG_KOR_NM || props.SIGUNGU_NM || props.sigungu_name;
        if (!sigungu) return;
        displayName = sigungu;
        // ★ CSV 이름 역추적(rawCsvData.find) 대신 geojson 자체의 소속 시도를 그대로 사용한다.
        // 이래야 동명 시군구(북구/중구/동구 등)와 데이터가 없는 지역(청송군 등)에서
        // "알수없음"이 뜨거나 엉뚱한 시도 데이터가 섞이는 문제가 재발하지 않는다.
        parentSido = props.sido || "알수없음";
      }
      
      // ★ 시군구 레이어는 이름만으로는 고유하지 않으므로(북구/중구 등 여러 시도에 중복 존재)
      // 반드시 소속 시도명까지 합쳐서 고유 key를 만든다.
      let featureKey = activeLayerScope === 'A' ? matchedSido : `${parentSido}::${displayName}`;

      // 리렌더링(필터 변경 등) 이후에도 기존 선택 지역의 검은 테두리를 복원한다.
      if (selectedScope === activeLayerScope && selectedKey === featureKey) {
        layer.setStyle({ color: '#000000', weight: 3 });
        selectedLayerRef = layer;
      }

      layer.on({
        click: () => {
          if (selectedScope === activeLayerScope && selectedKey === featureKey) {
            // 같은 지역을 다시 클릭 → 선택 해제 및 패널 초기화
            layer.setStyle({ color: '#ffffff', weight: activeLayerScope === 'A' ? 1.8 : 1 });
            selectedKey = null;
            selectedScope = null;
            selectedLayerRef = null;
            selectedSido = null;
            selectedSigungu = null;
            document.getElementById('detail-fallback').style.display = 'block';
            document.getElementById('detail-content').style.display = 'none';
            return;
          }

          if (selectedLayerRef) {
            selectedLayerRef.setStyle({ color: '#ffffff', weight: activeLayerScope === 'A' ? 1.8 : 1 });
          }
          layer.setStyle({ color: '#000000', weight: 3 });
          selectedKey = featureKey;
          selectedScope = activeLayerScope;
          selectedLayerRef = layer;
          selectedSido = parentSido;
          selectedSigungu = displayName;

          showTargetDetailPanel(parentSido, displayName);
        }
        // ★★★ hover(마우스 오버) 시 색이 절대 변하지 않도록 함 (요청에 따라 완전 제거, 절대 롤백 금지) ★★★
        // mouseover / mouseout 핸들러를 아예 두지 않는다. 클릭(선택) 이외에는 어떤 상호작용으로도
        // 지도 폴리곤의 색상/투명도가 바뀌지 않아야 한다.
      });
    }
  });

  geoJsonLayer.addTo(geojsonGroup);

  // ★ 라벨 좌표 동적 추출 로직 (Centroids.js 의존성 제거 완벽 해결)
  geoJsonLayer.eachLayer(function(layer) {
    let props = layer.feature.properties || {};
    let displayName = "";
    if (activeLayerScope === 'A') {
      let sido = props.CTP_KOR_NM || props.SIDONM || props.sido_name || props.name;
      if (sido) displayName = SIDO_NAME_MAP[sido] || sido;
    } else {
      displayName = props.name || props.SIG_KOR_NM || props.SIGUNGU_NM || props.sigungu_name || "";
    }
    
    if (displayName) {
      let center;
      if (activeLayerScope === 'A' && SIDO_LABEL_OVERRIDE[displayName]) {
        center = L.latLng(SIDO_LABEL_OVERRIDE[displayName][0], SIDO_LABEL_OVERRIDE[displayName][1]);
      } else {
        center = layer.getBounds().getCenter();
      }
      L.marker(center, {
        icon: L.divIcon({ className: 'map-label', html: displayName, iconSize: [120, 20], iconAnchor: [60, 10] })
      }).addTo(labelGroup);
    }
  });

  if (!showLabels) { map.removeLayer(labelGroup); }
}

function calculateGlobalStats() {
  const filtered = getFilteredData();
  let connectedA = new Set();
  let connectedB = new Set();
  let sumA = 0, sumB = 0;
  
  filtered.forEach(d => {
    if(d.anyContract || currentFilters.dept || currentFilters.type) {
      if(d.layer === 'A') {
        connectedA.add(d.sido);
        sumA += d.amt_total;
      } else if(d.layer === 'B') {
        connectedB.add(`${d.sido}_${d.sigungu}`);
        sumB += d.amt_total;
      }
    }
  });

  document.getElementById('total-a-count').innerText = `${connectedA.size} / 17 개 시도 체결`;
  document.getElementById('total-a-amt').innerText = `${sumA.toLocaleString()} 원`;
  document.getElementById('total-b-count').innerText = `${connectedB.size} / ${SIGUNGU_GEOJSON.features.length} 개 지역 체결`;
  document.getElementById('total-b-amt').innerText = `${sumB.toLocaleString()} 원`;
  document.getElementById('total-all-amt').innerText = `${(sumA + sumB).toLocaleString()} 원`;
}

// ★ 클릭한 타겟(A 또는 B)의 1:1 맞춤 금액 산출 패널 적용 완료
function showTargetDetailPanel(sido, sigungu) {
  document.getElementById('detail-fallback').style.display = 'none';
  const contentEl = document.getElementById('detail-content');
  contentEl.style.display = 'block';
  
  let isScopeA = activeLayerScope === 'A';
  let titleName = isScopeA ? sido : sigungu;
  let layerLabel = isScopeA ? '시도 단위(광역)' : '시군구 단위(기초)';

  // 패널 버튼(부서별 계약분석)에서 사용할 현재 컨텍스트 저장
  currentPanelSido = sido;
  currentPanelSigungu = sigungu;
  currentPanelIsScopeA = isScopeA;
  // ★ 부서 선택 상태는 다른 지역을 클릭해도 그대로 유지한다 (재클릭 불필요)
  
  // 1. 최상단 카드: 클릭한 해당 지역(A면 A, B면 B)만의 단독 데이터 계산
  let targetItems = rawCsvData.filter(d => 
    isScopeA ? (d.layer === 'A' && d.sido === sido) 
             : (d.layer === 'B' && d.sido === sido && d.sigungu === sigungu)
  );
  
  let hasContract = targetItems.some(d => d.anyContract);
  let statusALabel = hasContract ? '계약체결' : '미체결';
  let statusAClass = hasContract ? 'active-contract' : 'no-contract';
  let targetAmt = targetItems.reduce((acc, curr) => acc + curr.amt_total, 0);

  // 상위 광역(A) 지역명을 괄호로 함께 표시 (동명 시군구 혼동 방지용)
  let parentSuffix = !isScopeA ? ` <span style="font-size:12px; font-weight:500; color:#94a3b8;">(${sido})</span>` : '';

  // 2. 하단 리스트: 클릭한 지역이 속한 시도의 "실제" 하위 시군구 전체 목록 (상단 연도 필터와 연동)
  // ★ CSV에 등장하는 지역만 세면, 데이터가 일부만 있는 시도는 분모가 축소되어
  //   항상 "n개 중 n개 체결(100%)"처럼 잘못 보이는 버그가 있었다.
  //   반드시 sigungu.js(지도 geojson)에 실제로 존재하는 행정구역을 기준으로 삼는다.
  let yearFilter = currentFilters.year;
  let realSigunguNames = SIGUNGU_GEOJSON.features
    .filter(f => (f.properties || {}).sido === sido)
    .map(f => f.properties.name);

  let uniqueBList = realSigunguNames.map(name => {
    let matches = rawCsvData.filter(d =>
      d.layer === 'B' && d.sido === sido && d.sigungu === name && (!yearFilter || d.year === yearFilter)
    );
    return {
      sigungu: name,
      anyContract: matches.some(d => d.anyContract),
      신용정보: matches.some(d => d.신용정보),
      전자압류: matches.some(d => d.전자압류),
      EGS: matches.some(d => d.EGS)
    };
  });
  
  let activeBCount = uniqueBList.filter(b => b.anyContract).length;

  let listHtml = '';
  uniqueBList.forEach(b => {
    let isCurrent = (!isScopeA && b.sigungu === sigungu);
    let bgStyle = isCurrent ? 'background:#fff7ed; border:1px solid #fed7aa; border-radius:6px; padding:6px;' : 'padding-bottom:6px; border-bottom:1px dashed #edf2f7;';
    
    listHtml += `
      <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; ${bgStyle}">
        <span style="font-weight:${isCurrent?'700':'600'}; color:${isCurrent?'#9a3412':'#1a2340'};">• ${b.sigungu}</span>
        <div style="display:flex; gap:3px;">
          <span class="badge-light ${b.신용정보?'active-contract':''}">신용</span>
          <span class="badge-light ${b.전자압류?'active-contract':''}">압류</span>
          <span class="badge-light ${b.EGS?'active-contract':''}">EGS</span>
        </div>
      </div>
    `;
  });

  contentEl.innerHTML = `
    <div style="background:#f0f4fa; padding:12px; border-radius:6px; margin-bottom:12px;">
      <h3 style="font-size:16px; margin-bottom:8px; color:#003087;">${titleName}${parentSuffix} 계약현황</h3>
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <span style="font-size:13px; color:#475569;">${layerLabel} 여부</span>
        <span class="badge-light ${statusAClass}">${statusALabel}</span>
      </div>
      <div style="display:flex; justify-content:space-between;">
        <span style="font-size:13px; color:#475569;">해당 지역 체결 금액</span>
        <span style="font-weight:700; color:#0f172a;">${targetAmt.toLocaleString()}원</span>
      </div>
    </div>

    <div style="border-top:1px solid #e2e8f0; padding-top:12px; margin-bottom:12px;">
      <h4 style="font-size:14px; margin-bottom:8px; color:#334155;">부서별 계약분석</h4>
      <div style="display:flex; gap:6px; margin-bottom:10px;">
        <button class="btn-choice panel-dept-btn" id="panel-dept-btn-지방세" onclick="renderDeptBreakdown('지방세')" style="flex:1; font-size:12px; padding:6px 4px;">지방세</button>
        <button class="btn-choice panel-dept-btn" id="panel-dept-btn-세외수입" onclick="renderDeptBreakdown('세외수입')" style="flex:1; font-size:12px; padding:6px 4px;">세외수입</button>
        <button class="btn-choice panel-dept-btn" id="panel-dept-btn-기타" onclick="renderDeptBreakdown('기타')" style="flex:1; font-size:12px; padding:6px 4px;">기타</button>
      </div>
      <div id="dept-breakdown-container"></div>
    </div>
    
    <div style="border-top:1px solid #e2e8f0; padding-top:12px;">
      <h4 style="font-size:14px; margin-bottom:6px; color:#334155;">${sido} 하위 시군구(기초) 연동 현황</h4>
      <p style="font-size:12px; color:#64748b; margin-bottom:2px;">
        소속 지자체 <strong>${uniqueBList.length}개 중 ${activeBCount}개 체결</strong>
      </p>
      <p style="font-size:11px; color:#94a3b8; margin-bottom:8px;">연도 버튼을 눌러 확인하세요 (현재: ${yearFilter ? yearFilter + '년' : '전체 연도'})</p>
      <div style="max-height:200px; overflow-y:auto; padding-right:4px;">
        ${listHtml || '<p style="color:#94a3b8; font-size:12px;">하위 지자체 데이터가 존재하지 않습니다.</p>'}
      </div>
    </div>
  `;

  renderDeptBreakdown(currentPanelDept);
}

// 부서 버튼 클릭 시 해당 지역의 2025/2026년 × 유형별(신용정보/전자압류/EGS) 계약금액을 표(디자인 C)로 표시
function renderDeptBreakdown(dept) {
  currentPanelDept = dept;
  ['지방세', '세외수입', '기타'].forEach(d => {
    const btn = document.getElementById(`panel-dept-btn-${d}`);
    if (btn) btn.classList.toggle('active', d === dept);
  });

  let items = rawCsvData.filter(d => {
    let regionMatch = currentPanelIsScopeA
      ? (d.layer === 'A' && d.sido === currentPanelSido)
      : (d.layer === 'B' && d.sido === currentPanelSido && d.sigungu === currentPanelSigungu);
    return regionMatch && d[dept];
  });

  function sumFor(year, field) {
    return items.filter(d => d.year === year).reduce((acc, cur) => acc + cur[field], 0);
  }

  let y25 = {
    신용정보: sumFor('2025', 'amt_신용정보'),
    전자압류: sumFor('2025', 'amt_전자압류'),
    EGS: sumFor('2025', 'amt_EGS')
  };
  let y26 = {
    신용정보: sumFor('2026', 'amt_신용정보'),
    전자압류: sumFor('2026', 'amt_전자압류'),
    EGS: sumFor('2026', 'amt_EGS')
  };
  y25.total = y25.신용정보 + y25.전자압류 + y25.EGS;
  y26.total = y26.신용정보 + y26.전자압류 + y26.EGS;

  let diff = y26.total - y25.total;
  let totalColor = diff > 0 ? '#dc2626' : (diff < 0 ? '#2563eb' : '#1a2340');

  const container = document.getElementById('dept-breakdown-container');
  container.innerHTML = `
    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px;">
      <table style="width:100%; font-size:12px; border-collapse:collapse;">
        <thead>
          <tr style="border-bottom:1px solid #e2e8f0;">
            <th style="text-align:left; font-weight:600; color:#64748b; padding-bottom:6px;">유형</th>
            <th style="text-align:right; font-weight:600; color:#64748b; padding-bottom:6px;">2025년</th>
            <th style="text-align:right; font-weight:600; color:#64748b; padding-bottom:6px;">2026년</th>
          </tr>
        </thead>
        <tbody>
          <tr><td style="padding:6px 0;">신용정보</td><td style="text-align:right;">${y25.신용정보.toLocaleString()}</td><td style="text-align:right;">${y26.신용정보.toLocaleString()}</td></tr>
          <tr><td style="padding:6px 0;">전자압류</td><td style="text-align:right;">${y25.전자압류.toLocaleString()}</td><td style="text-align:right;">${y26.전자압류.toLocaleString()}</td></tr>
          <tr><td style="padding:6px 0;">EGS</td><td style="text-align:right;">${y25.EGS.toLocaleString()}</td><td style="text-align:right;">${y26.EGS.toLocaleString()}</td></tr>
          <tr style="border-top:1px solid #e2e8f0;">
            <td style="padding-top:8px; font-weight:700; color:#003087;">합계</td>
            <td style="text-align:right; padding-top:8px; font-weight:700;">${y25.total.toLocaleString()}</td>
            <td style="text-align:right; padding-top:8px; font-weight:700; color:${totalColor};">${y26.total.toLocaleString()}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

function renderGlobalAccordion() {
  const container = document.getElementById('sido-accordion-container');
  container.innerHTML = '';
  
  const uniqueSidos = ["서울특별시", "부산광역시", "대구광역시", "인천광역시", "광주광역시", "대전광역시", "울산광역시", "세종특별자치시", "경기도", "강원도", "충청북도", "충청남도", "전라북도", "전라남도", "경상북도", "경상남도", "제주특별자치도"];

  uniqueSidos.forEach(sidoName => {
    let sidosData = rawCsvData.filter(d => d.sido === sidoName);

    function sumDept(dept, year) {
      return sidosData.filter(d => d.year === year).reduce((a,c) => a + c[`amt_${dept}`], 0);
    }

    let dept_지방세_25 = sumDept('지방세', '2025');
    let dept_지방세_26 = sumDept('지방세', '2026');
    let dept_세외수입_25 = sumDept('세외수입', '2025');
    let dept_세외수입_26 = sumDept('세외수입', '2026');
    let dept_기타_25 = sumDept('기타', '2025');
    let dept_기타_26 = sumDept('기타', '2026');

    let total_2025 = dept_지방세_25 + dept_세외수입_25 + dept_기타_25;
    let total_2026 = dept_지방세_26 + dept_세외수입_26 + dept_기타_26;

    // 헤더 표시용 + 표 내 우측하단(총 합계 × 증감액) 공용 diff 포맷터
    function formatDiff(diff) {
      let color = diff > 0 ? '#dc2626' : (diff < 0 ? '#2563eb' : '#64748b');
      let arrow = diff > 0 ? '▲' : (diff < 0 ? '▼' : '');
      return `<span style="color:${color}; font-weight:700;">${arrow} ${Math.abs(diff).toLocaleString()}원</span>`;
    }

    let diff_지방세 = dept_지방세_26 - dept_지방세_25;
    let diff_세외수입 = dept_세외수입_26 - dept_세외수입_25;
    let diff_기타 = dept_기타_26 - dept_기타_25;
    let diff_total = total_2026 - total_2025;

    const accordionItem = document.createElement('div');
    accordionItem.className = 'accordion-item';
    
    accordionItem.innerHTML = `
      <div class="accordion-header" onclick="toggleAccordionElement(this)">
        <span style="pointer-events:none;">${sidoName}</span>
        <span style="display:flex; align-items:center; gap:8px; pointer-events:none;">
          ${formatDiff(diff_total)}
          <span class="chevron" style="color:#94a3b8; font-size:11px;">▼</span>
        </span>
      </div>
      <div class="accordion-content">
        <table>
          <thead>
            <tr>
              <th>부서명</th>
              <th style="text-align: right;">2025년</th>
              <th style="text-align: right;">2026년</th>
              <th style="text-align: right;">증감액</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>지방세</td>
              <td style="text-align: right;">${dept_지방세_25.toLocaleString()}원</td>
              <td style="text-align: right;">${dept_지방세_26.toLocaleString()}원</td>
              <td style="text-align: right;">${formatDiff(diff_지방세)}</td>
            </tr>
            <tr>
              <td>세외수입</td>
              <td style="text-align: right;">${dept_세외수입_25.toLocaleString()}원</td>
              <td style="text-align: right;">${dept_세외수입_26.toLocaleString()}원</td>
              <td style="text-align: right;">${formatDiff(diff_세외수입)}</td>
            </tr>
            <tr>
              <td>기타</td>
              <td style="text-align: right;">${dept_기타_25.toLocaleString()}원</td>
              <td style="text-align: right;">${dept_기타_26.toLocaleString()}원</td>
              <td style="text-align: right;">${formatDiff(diff_기타)}</td>
            </tr>
            <tr style="background:#f4f6fb; font-weight:700;">
              <td style="color:#003087;">총 합계</td>
              <td style="text-align: right; color:#003087;">${total_2025.toLocaleString()}원</td>
              <td style="text-align: right; color:#003087;">${total_2026.toLocaleString()}원</td>
              <td style="text-align: right;">${formatDiff(diff_total)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
    container.appendChild(accordionItem);
  });
}

function toggleAccordionElement(headerEl) {
  const contentEl = headerEl.nextElementSibling;
  const chevron = headerEl.querySelector('.chevron');
  const isVisible = contentEl.style.getPropertyValue('display') === 'block';
  
  contentEl.style.setProperty('display', isVisible ? 'none' : 'block');
  chevron.innerText = isVisible ? '▼' : '▲';
}
</script>
</body>
</html>
